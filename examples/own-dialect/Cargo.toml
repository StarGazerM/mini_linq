[package]
name = "own-dialect"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
members = ["printer"]

[dependencies]
own-push = { path = "printer" }
mini-linq = { path = "../../facade/mini-linq", default-features = false, features = ["written-order", "index-demands", "physical-lowering", "structure-selection"] }
cq-storage = { path = "../../runtime/cq-storage" }

[build-dependencies]
cq-workloads = { path = "../../workloads" }

[dev-dependencies]
cq-workload-e2e = { path = "../../workloads/e2e" }
cq-workloads = { path = "../../workloads" }
cq-state-providers = { path = "../../runtime/cq-state-providers" }
mini-linq = { path = "../../facade/mini-linq" }
