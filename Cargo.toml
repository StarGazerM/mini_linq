[dependencies]
cq-lang-cq.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
cq-lang-ra.workspace = true
proc-macro2.workspace = true

[features]
hw4 = []

[[test]]
name = "hw4_optional"
required-features = ["hw4"]

# Shared compiler/proc-macro execution keeps the existing consumer optimization.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Preserve the workload matrix's existing binary debug settings.
[profile.dev.package.cq-workload-corpus]
debug = 0

[profile.test.package.cq-workload-corpus]
debug = 0

[profile.dev.package.cq-workload-e2e]
debug = 0

[profile.test.package.cq-workload-e2e]
debug = 0

# Native storage benchmarks previously used isolated thin-LTO release profiles.
[profile.cpu-bench]
inherits = "release"
codegen-units = 1
lto = "thin"
