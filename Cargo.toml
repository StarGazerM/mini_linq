[package]
# Crate-owned examples below examples/ have their own completion gates.
autoexamples = false
name = "mini-linq-course"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[workspace]
members = [
    "crates/cq-ir",
    "crates/cq-storage",
    "crates/cq-query-lowering",
    "crates/cq-index-policy",
    "crates/cq-structure-selection",
    "crates/cq-physical-lowering",
    "crates/cq-physical-realization",
    "crates/cq-state-providers",
    "crates/mini-linq",
    "workloads",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
contracts = "=0.6.10"
cq-ir = { path = "crates/cq-ir" }
cq-storage = { path = "crates/cq-storage" }
cq-query-lowering = { path = "crates/cq-query-lowering", default-features = false }
cq-index-policy = { path = "crates/cq-index-policy", default-features = false }
cq-structure-selection = { path = "crates/cq-structure-selection", default-features = false }
cq-physical-lowering = { path = "crates/cq-physical-lowering", default-features = false }
cq-physical-realization = { path = "crates/cq-physical-realization", default-features = false }
cq-state-providers = { path = "crates/cq-state-providers" }
mini-linq = { path = "crates/mini-linq" }
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full", "visit"] }
syn_derive = { git = "https://github.com/StarGazerM/syn_derive", rev = "97bbe5871ac5ca8e9ba64cf50ba78d75e8cb2562" }

[dependencies]
cq-ir.workspace = true
mini-linq.workspace = true
quote.workspace = true
syn.workspace = true

[[example]]
name = "cq-inspection"
path = "examples/cq-inspection/main.rs"

[[example]]
name = "free-variables"
path = "examples/free-variables/main.rs"

[dev-dependencies]
cq-state-providers.workspace = true
cq-storage.workspace = true
