[package]
# External consumers under features/ have their own completion gates.
autoexamples = false
name = "mini-linq-course"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[workspace]
members = [
    "languages/cq-syntax",
    "languages/cq-lang-cq",
    "languages/cq-lang-vo",
    "languages/cq-lang-ra",
    "languages/cq-lang-ix",
    "languages/cq-lang-physical",
    "languages/cq-lang-structures",
    "languages/cq-lang-sequence",
    "passes/cq-order",
    "passes/cq-reduce",
    "passes/cq-elaborate",
    "passes/cq-index-policy",
    "passes/cq-physical-lowering",
    "passes/cq-structure-selection",
    "passes/cq-represent",
    "passes/cq-staging",
    "passes/cq-print",
    "passes/cq-physical-realization",
    "runtime/cq-storage",
    "runtime/cq-load",
    "testkit/cq-testkit",
    "facade/cq-stage",
    "facade/mini-linq",
    "facade/mini-linq-macros",
]
exclude = ["features", "tools/fixtures"]
resolver = "3"

# Keep optional testkit DuckDB native archives small.
[profile.dev.package.libduckdb-sys]
debug = false

[profile.test.package.libduckdb-sys]
debug = false

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
cq-testkit = { path = "testkit/cq-testkit", version = "0.1.0" }
cq-print = { path = "passes/cq-print", version = "0.1.0", default-features = false }
cq-stage = { path = "facade/cq-stage", version = "0.1.0" }
cq-lang-physical = { path = "languages/cq-lang-physical", version = "0.1.0", default-features = false }
cq-lang-cq = { path = "languages/cq-lang-cq", version = "0.1.0", default-features = false }
cq-lang-structures = { path = "languages/cq-lang-structures", version = "0.1.0", default-features = false }
cq-lang-sequence = { path = "languages/cq-lang-sequence", version = "0.1.0", default-features = false }
cq-lang-ra = { path = "languages/cq-lang-ra", version = "0.1.0", default-features = false }
cq-syntax = { path = "languages/cq-syntax", version = "0.1.0" }
cq-lang-ix = { path = "languages/cq-lang-ix", version = "0.1.0", default-features = false }
cq-lang-vo = { path = "languages/cq-lang-vo", version = "0.1.0", default-features = false }
cq-storage = { path = "runtime/cq-storage", version = "0.1.0" }
cq-load = { path = "runtime/cq-load", version = "0.1.0" }
cq-order = { path = "passes/cq-order", version = "0.1.0", default-features = false }
cq-elaborate = { path = "passes/cq-elaborate", version = "0.1.0", default-features = false }
cq-reduce = { path = "passes/cq-reduce", version = "0.1.0", default-features = false }
cq-index-policy = { path = "passes/cq-index-policy", version = "0.1.0", default-features = false }
cq-structure-selection = { path = "passes/cq-structure-selection", version = "0.1.0", default-features = false }
cq-represent = { path = "passes/cq-represent", version = "0.1.0", default-features = false }
cq-staging = { path = "passes/cq-staging", version = "0.1.0", default-features = false }
cq-physical-lowering = { path = "passes/cq-physical-lowering", version = "0.1.0", default-features = false }
cq-physical-realization = { path = "passes/cq-physical-realization", version = "0.1.0", default-features = false }
mini-linq = { path = "facade/mini-linq", version = "0.1.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full", "visit", "visit-mut"] }
syn_derive = { version = "0.2.0", git = "https://github.com/StarGazerM/syn_derive", rev = "97bbe5871ac5ca8e9ba64cf50ba78d75e8cb2562" }

[dependencies]
cq-lang-cq.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
cq-lang-ra.workspace = true
proc-macro2.workspace = true

[features]
hw4 = []

[[test]]
name = "hw4_optional"
required-features = ["hw4"]
