[package]
# Crate-owned examples below examples/ have their own completion gates.
autoexamples = false
name = "mini-linq-course"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[workspace]
members = [
    "languages/cq-syntax",
    "languages/cq-lang-cq",
    "languages/cq-lang-vo",
    "languages/cq-lang-ra",
    "languages/cq-lang-ix",
    "languages/cq-lang-physical",
    "languages/cq-lang-structures",
    "passes/cq-order",
    "passes/cq-reduce",
    "passes/cq-elaborate",
    "passes/cq-index-policy",
    "passes/cq-physical-lowering",
    "passes/cq-structure-selection",
    "passes/cq-print",
    "passes/cq-physical-realization",
    "runtime/cq-storage",
    "runtime/cq-state-providers",
    "runtime/cq-protocol",
    "facade/cq-stage",
    "facade/mini-linq",
    "workloads",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
cq-print = { path = "passes/cq-print", default-features = false }
cq-stage = { path = "facade/cq-stage" }
contracts = "=0.6.10"
cq-lang-physical = { path = "languages/cq-lang-physical", default-features = false }
cq-lang-cq = { path = "languages/cq-lang-cq", default-features = false }
cq-lang-structures = { path = "languages/cq-lang-structures", default-features = false }
cq-lang-ra = { path = "languages/cq-lang-ra", default-features = false }
cq-syntax = { path = "languages/cq-syntax" }
cq-lang-ix = { path = "languages/cq-lang-ix", default-features = false }
cq-lang-vo = { path = "languages/cq-lang-vo", default-features = false }
cq-protocol = { path = "runtime/cq-protocol" }
cq-storage = { path = "runtime/cq-storage" }
cq-order = { path = "passes/cq-order", default-features = false }
cq-elaborate = { path = "passes/cq-elaborate", default-features = false }
cq-reduce = { path = "passes/cq-reduce", default-features = false }
cq-index-policy = { path = "passes/cq-index-policy", default-features = false }
cq-structure-selection = { path = "passes/cq-structure-selection", default-features = false }
cq-physical-lowering = { path = "passes/cq-physical-lowering", default-features = false }
cq-physical-realization = { path = "passes/cq-physical-realization", default-features = false }
cq-state-providers = { path = "runtime/cq-state-providers" }
mini-linq = { path = "facade/mini-linq" }
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full", "visit"] }
syn_derive = { git = "https://github.com/StarGazerM/syn_derive", rev = "97bbe5871ac5ca8e9ba64cf50ba78d75e8cb2562" }

[dependencies]
cq-lang-cq.workspace = true
cq-syntax.workspace = true
mini-linq.workspace = true
quote.workspace = true
syn.workspace = true

[[example]]
name = "cq-inspection"
path = "examples/cq-inspection/main.rs"

[[example]]
name = "free-variables"
path = "examples/free-variables/main.rs"

[dev-dependencies]
cq-lang-ra.workspace = true
proc-macro2.workspace = true
cq-state-providers.workspace = true
cq-storage.workspace = true

[features]
hw4 = []

[[test]]
name = "hw4_optional"
path = "languages/cq-lang-cq/tests/hw4_optional.rs"
required-features = ["hw4"]
