cq-datalog-surface-if-let = { version = "0.0.0", path = "features/datalog/passes/surface-if-let" }
cq-ext-aggregate = { path = "features/extensions/cq-ext-aggregate" }
cq-ext-correlated = { path = "features/extensions/cq-ext-correlated" }
cq-ext-recursion = { path = "features/extensions/cq-ext-recursion" }
cq-ext-support = { path = "features/extensions/cq-ext-support" }
cq-join-filters = { path = "features/join-filters" }
cq-lang-datalog-incremental = { version = "0.0.0", path = "features/datalog/languages/dl-incremental" }
cq-lang-datalog-round = { version = "0.0.0", path = "features/datalog/languages/dl-round" }
cq-lang-datalog-source = { version = "0.0.0", path = "features/datalog/languages/dl-source" }
cq-lang-datalog-storage = { version = "0.0.0", path = "features/datalog/languages/dl-storage" }
cq-lang-datalog-strata = { version = "0.0.0", path = "features/datalog/languages/dl-strata" }
cq-lang-trace = { version = "0.0.0", path = "features/stacked-ir/trace" }
cq-planners = { path = "features/planners" }
cq-planners-plan = { path = "features/planners/plan" }
cq-rewrite-passes = { path = "features/rewrites/passes" }
cq-rewrites = { path = "features/rewrites" }
cq-sequence-tasks = { path = "features/sequence-tasks" }
cq-sequence-tasks-macros = { path = "features/sequence-tasks/macros" }
