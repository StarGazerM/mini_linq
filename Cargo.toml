[package]
# Crate-owned examples below examples/ have their own completion gates.
autoexamples = false
name = "mini-linq-course"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[workspace]
members = [
    "crates/cq-ir",
    "crates/cq-storage",
    "crates/cq-query-lowering",
    "crates/cq-index-policy",
    "crates/cq-stream-lowering",
    "crates/cq-stream-realization",
    "crates/cq-physical-selection",
    "crates/cq-physical-lowering",
    "crates/cq-example-providers",
    "crates/cq-access-lowering",
    "crates/cq-pipeline-lowering",
    "crates/mini-linq",
    "workloads",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
contracts = "=0.6.10"
cq-ir = { path = "crates/cq-ir" }
cq-storage = { path = "crates/cq-storage" }
cq-query-lowering = { path = "crates/cq-query-lowering", default-features = false }
cq-index-policy = { path = "crates/cq-index-policy", default-features = false }
cq-stream-lowering = { path = "crates/cq-stream-lowering", default-features = false }
cq-stream-realization = { path = "crates/cq-stream-realization", default-features = false }
cq-physical-selection = { path = "crates/cq-physical-selection" }
cq-physical-lowering = { path = "crates/cq-physical-lowering" }
cq-example-providers = { path = "crates/cq-example-providers" }
mini-linq = { path = "crates/mini-linq" }
cq-access-lowering = { path = "crates/cq-access-lowering", default-features = false }
cq-pipeline-lowering = { path = "crates/cq-pipeline-lowering", default-features = false }
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full", "visit"] }
syn_derive = { git = "https://github.com/StarGazerM/syn_derive", rev = "97bbe5871ac5ca8e9ba64cf50ba78d75e8cb2562" }

[dependencies]
cq-ir.workspace = true
mini-linq.workspace = true
quote.workspace = true
syn.workspace = true

[[example]]
name = "cq-inspection"
path = "examples/cq-inspection/main.rs"

[[example]]
name = "pull-execution"
path = "examples/pull-execution/main.rs"

[[example]]
name = "free-variables"
path = "examples/free-variables/main.rs"

[dev-dependencies]
cq-example-providers.workspace = true
