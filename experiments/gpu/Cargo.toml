[workspace]
members = ["tiles", "compress", "compress-host", "h05-reference", "printer-runtime", "h05-compiled", "device-columns", "device-columns-oracle", "sequence", "sequence-runtime", "datalog-runtime", "datalog", "datalog/facade", "datalog/macros", "doop", "tpch"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Pinned heads of the maintained cuda-oxide and RCCL mini-linq/main fork branches.
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "496c01bfc5df0dad510bc4ca76e2260d6f586b8f" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "496c01bfc5df0dad510bc4ca76e2260d6f586b8f" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "496c01bfc5df0dad510bc4ca76e2260d6f586b8f" }
rccl-memory = { git = "https://github.com/StarGazerM/rccl.git", rev = "8e329e2528a4ffac0518118d047af7f2096c6917" }
rccl-cub = { git = "https://github.com/StarGazerM/rccl.git", rev = "8e329e2528a4ffac0518118d047af7f2096c6917" }
rccl-thrust = { git = "https://github.com/StarGazerM/rccl.git", rev = "8e329e2528a4ffac0518118d047af7f2096c6917" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 1


