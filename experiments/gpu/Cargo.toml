[workspace]
members = ["tiles", "compress", "compress-host", "h05-reference", "printer-runtime", "h05-compiled", "device-columns", "device-columns-oracle", "sequence", "sequence-runtime", "datalog-runtime", "datalog", "datalog/facade", "datalog/macros", "doop", "tpch"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Pinned heads of the maintained cuda-oxide and RCCL mini-linq/main fork branches.
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "e7d4a63baac987e2094cc874aac31998d2cbf32a" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "e7d4a63baac987e2094cc874aac31998d2cbf32a" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "e7d4a63baac987e2094cc874aac31998d2cbf32a" }
rccl-memory = { git = "https://github.com/StarGazerM/rccl.git", rev = "d4c95133fd8891a242802ecad88f119377590b69" }
rccl-cub = { git = "https://github.com/StarGazerM/rccl.git", rev = "d4c95133fd8891a242802ecad88f119377590b69" }
rccl-thrust = { git = "https://github.com/StarGazerM/rccl.git", rev = "d4c95133fd8891a242802ecad88f119377590b69" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 1

# Proc macros and their pass crates run the whole Datalog/CQ compiler during
# expansion; Cargo's build-override default (opt-level 0) leaves them unoptimized.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

# Generated DOOP host code places holes, strata and phases in partitioned
# non-inlined runners; parallel LLVM codegen units compile them concurrently.
[profile.release.package.doop-gpu]
codegen-units = 16


