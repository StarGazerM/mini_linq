[workspace]
members = ["tiles", "blocked-run", "h05", "triangles", "triangles-runner", "printer", "printer-runtime", "h05-compiled", "device-columns", "device-columns-oracle"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "5f7c34fddadcf250f2e45d0cffe83a3d27f2bea3" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "5f7c34fddadcf250f2e45d0cffe83a3d27f2bea3" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "5f7c34fddadcf250f2e45d0cffe83a3d27f2bea3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 1
