[workspace]
members = ["tiles", "compress", "compress-host", "h05-reference", "printer-runtime", "h05-compiled", "device-columns", "device-columns-oracle", "sequence", "sequence-runtime", "datalog-runtime", "datalog", "datalog/facade", "datalog/macros", "doop", "tpch"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Pinned heads of the maintained cuda-oxide and RCCL mini-linq/main fork branches.
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "bb850d8326ff08deb1508b7572f537387da30403" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "bb850d8326ff08deb1508b7572f537387da30403" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "bb850d8326ff08deb1508b7572f537387da30403" }
rccl-memory = { git = "https://github.com/StarGazerM/rccl.git", rev = "292bf9b047bc37db5d2d6e1a01d0ef8f8da3bc12" }
rccl-cub = { git = "https://github.com/StarGazerM/rccl.git", rev = "292bf9b047bc37db5d2d6e1a01d0ef8f8da3bc12" }
rccl-thrust = { git = "https://github.com/StarGazerM/rccl.git", rev = "292bf9b047bc37db5d2d6e1a01d0ef8f8da3bc12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 1


