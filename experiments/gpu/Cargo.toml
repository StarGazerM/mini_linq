[workspace]
members = ["tiles", "compress", "compress-host", "h05-reference", "printer-runtime", "h05-compiled", "device-columns", "device-columns-oracle", "sequence", "sequence-runtime", "datalog-runtime", "datalog", "datalog/facade", "datalog/macros", "doop", "tpch"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Pinned heads of the maintained cuda-oxide and RCCL mini-linq/main fork branches.
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "d89093b8149b93c63324c5a0e687a097061f117c" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "d89093b8149b93c63324c5a0e687a097061f117c" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "d89093b8149b93c63324c5a0e687a097061f117c" }
rccl-memory = { git = "https://github.com/StarGazerM/rccl.git", rev = "67f06e4ad723d6fefb7222bbead01ea94a20f29b" }
rccl-cub = { git = "https://github.com/StarGazerM/rccl.git", rev = "67f06e4ad723d6fefb7222bbead01ea94a20f29b" }
rccl-thrust = { git = "https://github.com/StarGazerM/rccl.git", rev = "67f06e4ad723d6fefb7222bbead01ea94a20f29b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 1


