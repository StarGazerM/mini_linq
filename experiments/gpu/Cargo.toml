[workspace]
members = ["tiles", "compress", "compress-host", "h05-reference", "printer-runtime", "h05-compiled", "device-columns", "device-columns-oracle", "sequence", "sequence-runtime", "datalog-runtime", "datalog", "datalog/facade", "datalog/macros", "doop", "srd-doop", "tpch", "fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Pinned heads of the maintained cuda-oxide fork and the RCCL pooled-workspace branch.
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "57eacecc081fe1809a815ae4ca32643884dce15b" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "57eacecc081fe1809a815ae4ca32643884dce15b" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "57eacecc081fe1809a815ae4ca32643884dce15b" }
rccl-memory = { git = "https://github.com/StarGazerM/rccl.git", rev = "a74cb59fb86ad0b78cf7cb4e1b76cf6cd21a858c" }
rccl-cub = { git = "https://github.com/StarGazerM/rccl.git", rev = "a74cb59fb86ad0b78cf7cb4e1b76cf6cd21a858c" }
rccl-thrust = { git = "https://github.com/StarGazerM/rccl.git", rev = "a74cb59fb86ad0b78cf7cb4e1b76cf6cd21a858c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
# Compile independent runtime modules and generated non-inlined query runners
# concurrently; a single unit serializes LLVM across the dependency chain.
codegen-units = 16

# Proc macros and their pass crates run the whole Datalog/CQ compiler during
# expansion; Cargo's build-override default (opt-level 0) leaves them unoptimized.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
