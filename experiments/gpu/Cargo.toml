[workspace]
members = ["tiles", "compress", "compress-host", "h05-reference", "printer-runtime", "h05-compiled", "device-columns", "device-columns-oracle", "sequence", "sequence-runtime", "datalog-runtime", "datalog", "datalog/facade", "datalog/macros", "doop", "srd-doop", "tpch"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Pinned heads of the maintained cuda-oxide and RCCL mini-linq/main fork branches.
cuda-core = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "1c1c4210522089bc25cc32f4808b2a06e91ff9e4" }
cuda-device = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "1c1c4210522089bc25cc32f4808b2a06e91ff9e4" }
cuda-host = { git = "https://github.com/StarGazerM/cuda-oxide.git", rev = "1c1c4210522089bc25cc32f4808b2a06e91ff9e4" }
rccl-memory = { git = "https://github.com/StarGazerM/rccl.git", rev = "8649af3eaa6b0e896a75e96d3faa8d18357b1372" }
rccl-cub = { git = "https://github.com/StarGazerM/rccl.git", rev = "8649af3eaa6b0e896a75e96d3faa8d18357b1372" }
rccl-thrust = { git = "https://github.com/StarGazerM/rccl.git", rev = "8649af3eaa6b0e896a75e96d3faa8d18357b1372" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = false
codegen-units = 1

# Proc macros and their pass crates run the whole Datalog/CQ compiler during
# expansion; Cargo's build-override default (opt-level 0) leaves them unoptimized.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

# Generated DOOP host code places holes, strata and phases in partitioned
# non-inlined runners; parallel LLVM codegen units compile them concurrently.
[profile.release.package.doop-gpu]
codegen-units = 16


