[package]
name = "cq-gpu-sequence"
version = "0.1.0"
edition = "2024"

[dependencies]
cq-gpu-sequence-core = { path = "core" }
cq-gpu-sequence-macros = { path = "macros" }
cq-lang-sequence = { path = "../../../languages/cq-lang-sequence" }
cq-lang-structures = { path = "../../../languages/cq-lang-structures" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }

[features]
cuda-oracle = []
cuda-retry-oracle = ["cuda-oracle"]

[dev-dependencies]
cq-gpu-sequence-test-macros = { path = "tests/support/macros" }
cq-gpu-runtime = { path = "../printer-runtime" }
cq-gpu-sequence-runtime = { path = "../sequence-runtime" }
cuda-device.workspace = true
cuda-core.workspace = true
cuda-host.workspace = true
gpu-compress = { path = "../compress" }
serde_json.workspace = true

[[example]]
name = "h05"
required-features = ["cuda-oracle"]
