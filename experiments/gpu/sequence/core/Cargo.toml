[package]
name = "cq-gpu-sequence-core"
version = "0.1.0"
edition = "2024"

[dependencies]
cq-lang-sequence = { path = "../../../../languages/cq-lang-sequence" }
cq-lang-structures = { path = "../../../../languages/cq-lang-structures" }
cq-print = { path = "../../../../passes/cq-print" }
cq-physical-realization = { path = "../../../../passes/cq-physical-realization" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
