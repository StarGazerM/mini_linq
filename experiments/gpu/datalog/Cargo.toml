[package]
name = "cq-gpu-datalog"
version = "0.1.0"
edition.workspace = true

[lib]
proc-macro = true

[features]
dedup-staged = []
dedup-fused = []

[dependencies]
cq-lang-datalog = { path = "../../../features/datalog/language" }
cq-datalog-schedule = { path = "../../../features/datalog/schedule" }
cq-datalog-fork = { path = "../../../features/datalog/fork" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild = "1"
mini-linq = { path = "../../../facade/mini-linq" }
cq-rewrites = { path = "../../../features/rewrites" }
cq-storage = { path = "../../../runtime/cq-storage" }
cq-gpu = { path = "../printer" }
cq-gpu-runtime = { path = "../printer-runtime" }
cuda-core.workspace = true
cuda-device.workspace = true
cuda-host.workspace = true
