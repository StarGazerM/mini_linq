[package]
name = "cq-gpu-datalog"
version = "0.1.0"
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
cq-lang-datalog-source = { path = "../../../../features/datalog/languages/dl-source" }
cq-lang-datalog-storage = { path = "../../../../features/datalog/languages/dl-storage" }
cq-lang-datalog-round = { path = "../../../../features/datalog/languages/dl-round" }
cq-datalog-stratify = { path = "../../../../features/datalog/passes/stratify" }
cq-datalog-incremental = { path = "../../../../features/datalog/passes/incremental" }
cq-datalog-storage = { path = "../../../../features/datalog/passes/storage" }
cq-datalog-fork = { path = "../../../../features/datalog/passes/fork" }
cq-stage = { path = "../../../../facade/cq-stage" }
cq-lang-physical = { path = "../../../../languages/cq-lang-physical" }
cq-rewrite-passes = { path = "../../../../features/rewrites/passes" }
cq-lang-structures = { path = "../../../../languages/cq-lang-structures" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
cq-datalog = { path = "../../../../features/datalog/facade/cq-datalog" }
cq-planners-plan = { path = "../../../../features/planners/plan" }
cq-index-policy = { path = "../../../../passes/cq-index-policy" }
cq-physical-lowering = { path = "../../../../passes/cq-physical-lowering" }
cq-structure-selection = { path = "../../../../passes/cq-structure-selection" }
trybuild = "1"
mini-linq = { path = "../../../../facade/mini-linq" }
cq-rewrites = { path = "../../../../features/rewrites" }
cq-planners = { path = "../../../../features/planners" }
cq-storage = { path = "../../../../runtime/cq-storage" }
cq-gpu = { path = "../printer" }
cq-gpu-runtime = { path = "../../printer-runtime", features = ["legacy-datalog"] }
cuda-core.workspace = true
cuda-device.workspace = true
cuda-host.workspace = true
