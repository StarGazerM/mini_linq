[package]
name = "cq-gpu"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
proc-macro = true

[dependencies]
cq-lang-structures = { version = "0.1.0", path = "../../../../languages/cq-lang-structures" }
cq-print = { version = "0.1.0", path = "../../../../passes/cq-print" }
cq-stage = { version = "0.1.0", path = "../../../../facade/cq-stage" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }

[dev-dependencies]
trybuild = "1"
cq-rewrite-passes = { path = "../../../../features/rewrites/passes" }
