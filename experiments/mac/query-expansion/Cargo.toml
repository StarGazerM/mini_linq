[package]
name = "mac-query-expansion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
default-run = "mac-query-expansion"

[dependencies]
cq-mac = { path = "../cq-mac" }
cq-storage = { path = "../../../runtime/cq-storage" }
cq-load = { path = "../../../io/cq-load", features = ["parquet"] }
mini-linq = { path = "../../../facade/mini-linq" }
# The unchanged workload runtime expands every authored H03/H09 configuration.
cq-planners = { path = "../../../features/planners" }
cq-rewrites = { path = "../../../features/rewrites" }
cq-ext-aggregate = { path = "../../../features/extensions/cq-ext-aggregate" }
cq-ext-correlated = { path = "../../../features/extensions/cq-ext-correlated" }
cq-sequence-tasks = { path = "../../../features/sequence-tasks" }
cq-sequence-tasks-macros = { path = "../../../features/sequence-tasks/macros" }
cq-workload-passes = { path = "../../../features/workloads/pipeline-passes" }
rayon = "1"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
