[package]
name = "mac-query-expansion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
default-run = "mac-query-expansion"

[workspace]

[dependencies]
cq-mac = { path = "../../../runtime/cq-mac" }
cq-storage = { path = "../../../runtime/cq-storage" }
cq-load = { path = "../../../runtime/cq-load" }
mini-linq = { path = "../../../facade/mini-linq" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
debug = 1
