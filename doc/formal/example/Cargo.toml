[package]
name = "mini-linq-paper-overview"
default-run = "mini-linq-paper-overview"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

# This documentation driver is outside the compiler workspace.
[workspace]

[dependencies]
cq-compose = { path = "../../../crates/cq-compose" }
cq-query-lowering = { path = "../../../crates/cq-query-lowering", default-features = false, features = ["clause-prefix", "hypergraph"] }
cq-index-policy = { path = "../../../crates/cq-index-policy", default-features = false, features = ["result-demands"] }
cq-access-lowering = { path = "../../../crates/cq-access-lowering", default-features = false, features = ["to-pipeline"] }
cq-pipeline-lowering = { path = "../../../crates/cq-pipeline-lowering", default-features = false, features = ["distinct-iter", "collect-set", "support-iter"] }
cq-relation-lowering = { path = "../../../crates/cq-relation-lowering", default-features = false, features = ["materialized-hash", "prefix-hash"] }
cq-ir = { path = "../../../crates/cq-ir" }
mini-linq = { path = "../../../crates/mini-linq" }
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
prettyplease = "0.2"
