[package]
name = "mini-linq-paper-overview"
default-run = "mini-linq-paper-overview"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

# This documentation driver is outside the compiler workspace.
[workspace]

[dependencies]
cq-lang-cq = { path = "../../../languages/cq-lang-cq" }
cq-lang-ix = { path = "../../../languages/cq-lang-ix" }
cq-lang-ra = { path = "../../../languages/cq-lang-ra" }
cq-lang-vo = { path = "../../../languages/cq-lang-vo" }
cq-elaborate = { path = "../../../passes/cq-elaborate" }
cq-index-policy = { path = "../../../passes/cq-index-policy" }
cq-order = { path = "../../../passes/cq-order" }
cq-reduce = { path = "../../../passes/cq-reduce" }
quote = "1"
syn = { version = "2", features = ["full"] }
