[package]
name = "mini-linq-paper-overview"
default-run = "mini-linq-paper-overview"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

# This documentation driver is outside the compiler workspace.
[workspace]

[dependencies]
cq-query-lowering = { path = "../../../crates/cq-query-lowering", default-features = false, features = ["written-order", "clause-prefix", "hypergraph"] }
cq-index-policy = { path = "../../../crates/cq-index-policy" }
cq-ir = { path = "../../../crates/cq-ir" }
quote = "1"
syn = { version = "2", features = ["full"] }
