[package]
name = "mini-linq-paper-overview"
default-run = "mini-linq-paper-overview"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

# This documentation driver is outside the compiler workspace.
[workspace]

[dependencies]
cq-elaborate = { path = "../../../crates/cq-elaborate" }
cq-index-policy = { path = "../../../crates/cq-index-policy" }
cq-ir = { path = "../../../crates/cq-ir" }
cq-order = { path = "../../../crates/cq-order" }
cq-reduce = { path = "../../../crates/cq-reduce" }
quote = "1"
syn = { version = "2", features = ["full"] }
