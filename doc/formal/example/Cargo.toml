[package]
name = "mini-linq-paper-overview"
default-run = "mini-linq-paper-overview"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

# This documentation driver is outside the compiler workspace.
[workspace]

[dependencies]
cq-compose = { path = "../../../crates/cq-compose" }
cq-plan = { path = "../../../crates/cq-plan", default-features = false, features = ["prefix", "graph"] }
cq-index = { path = "../../../crates/cq-index", default-features = false, features = ["result"] }
cq-execution = { path = "../../../crates/cq-execution", default-features = false, features = ["pull"] }
cq-pipeline = { path = "../../../crates/cq-pipeline", default-features = false, features = ["iterator", "collect", "stream"] }
cq-realize = { path = "../../../crates/cq-realize", default-features = false, features = ["hash-materialized", "hash-prefix"] }
cq-ir = { path = "../../../crates/cq-ir" }
mini-linq = { path = "../../../crates/mini-linq" }
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
prettyplease = "0.2"
