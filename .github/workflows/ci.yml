name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Fetch locked dependencies for isolated and packaged gates
        run: cargo fetch --locked
      - name: Verify component dependency boundaries
        run: python3 tools/check_dependencies.py --isolate --frontends --consumers
      - name: Test restored compiler regressions
        env:
          CARGO_BUILD_JOBS: 2
        run: bash tools/test_regressions.sh
      - name: Test packaged public API outside the checkout
        run: python3 tools/check_external.py
      - name: Check reviewed public API snapshots
        run: python3 tools/check_public_api.py
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check formal source correspondence
        run: python3 doc/formal/check.py
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: target/regression-logs/
