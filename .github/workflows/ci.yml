name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CARGO_INCREMENTAL: "0"
      # Debug info dominates the size of the many test and isolation targets.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Macro-heavy test crates exhaust the runner's memory with full parallelism.
      CARGO_BUILD_JOBS: "3"
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile-ci && sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci && sudo swapon /swapfile-ci
          free -h
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-expand (stacked-IR expansion regression)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Fetch locked dependencies for isolated and packaged gates
        run: |
          cargo fetch --locked
          # Feature-only dependencies (for example Ascent) are not in the root lock.
          for manifest in features/*/Cargo.toml; do
            cargo fetch --locked --manifest-path "$manifest"
          done
          # cargo package --offline resolves the packaged cq-syntax against the
          # crates.io syn_derive (the workspace uses a git pin), so its whole
          # index closure (proc-macro-error2, ...) must already be cached.
          mkdir -p "$RUNNER_TEMP/syn-derive-closure/src"
          printf '[package]\nname = "syn-derive-closure"\nversion = "0.0.0"\nedition = "2021"\n[dependencies]\nsyn_derive = "=0.2.0"\n' > "$RUNNER_TEMP/syn-derive-closure/Cargo.toml"
          : > "$RUNNER_TEMP/syn-derive-closure/src/lib.rs"
          cargo fetch --manifest-path "$RUNNER_TEMP/syn-derive-closure/Cargo.toml"
      - name: Verify component dependency boundaries
        # Frontend/consumer facade targets run once, in `cargo test --workspace`.
        run: python3 tools/check_dependencies.py --isolate
      - name: Drop isolation build artifacts
        run: rm -rf target/component-isolation && df -h /
      - name: Test restored compiler regressions
        run: bash tools/test_regressions.sh
      - name: Drop feature build artifacts
        # Feature workspaces share features/target; workloads keeps its own.
        run: |
          rm -rf features/target
          df -h /
      - name: Test packaged public API outside the checkout
        run: python3 tools/check_external.py
      - name: Check reviewed public API snapshots
        run: python3 tools/check_public_api.py
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check formal source correspondence
        run: python3 doc/formal/check.py
      - name: Check workload goldens
        run: cargo xtask golden
      - name: Run seeded differential fuzzing
        run: cargo xtask fuzz --cases 200
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: target/regression-logs/
