[workspace]
members = [".", "macros"]
resolver = "3"

[workspace.dependencies]
cq-lang-sequence = { path = "../../languages/cq-lang-sequence" }
cq-sequence-pull = { path = "../../passes/cq-sequence-pull" }
cq-sequence-tasks = { path = "." }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[package]
name = "cq-sequence-tasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Checked Sequence translation for ordered Rayon tasks"

[dependencies]
cq-lang-sequence.workspace = true
cq-sequence-pull.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
cq-testkit = { path = "../../testkit/cq-testkit", features = ["sequence-conformance"] }
cq-structure-selection = { path = "../../passes/cq-structure-selection" }

[package.metadata.cq]
source = "cq-lang-sequence"
target = "rust"
printer = true
