
[package]
name = "cq-sequence-tasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Checked Sequence translation for ordered Rayon tasks"

[dependencies]
cq-lang-sequence.workspace = true
cq-sequence-pull.workspace = true
cq-print = { path = "../../passes/cq-print" }
cq-sequence-plan = { path = "../../passes/cq-sequence-plan" }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
cq-storage = { path = "../../runtime/cq-storage" }
rayon = "1"

[dev-dependencies]
cq-sequence-conformance = { path = "../sequence-conformance" }
cq-testkit = { path = "../../testkit/cq-testkit" }
cq-structure-selection = { path = "../../passes/cq-structure-selection" }
cq-sequence-lowering = { path = "../../passes/cq-sequence-lowering" }
cq-load = { path = "../../runtime/cq-load", default-features = false }
cq-storage = { path = "../../runtime/cq-storage", features = ["counters"] }

[package.metadata.cq]
source = "cq-lang-sequence"
target = "rust"
printer = true
