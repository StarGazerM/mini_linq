[workspace]
members = [".", "macros", "conformance"]
resolver = "3"

[workspace.dependencies]
cq-lang-sequence = { path = "../../languages/cq-lang-sequence" }
cq-sequence-pull = { path = "../../passes/cq-sequence-pull" }
cq-sequence-tasks = { path = "." }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }

[package]
name = "cq-sequence-tasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Checked Sequence translation for ordered Rayon tasks"

[dependencies]
cq-lang-sequence.workspace = true
cq-sequence-pull.workspace = true
cq-print = { path = "../../passes/cq-print" }
cq-sequence-rewrite-passes = { path = "../../passes/cq-sequence-rewrite-passes" }
cq-sequence-plan = { path = "../../passes/cq-sequence-plan" }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
cq-storage = { path = "../../runtime/cq-storage" }
rayon = "1"

[dev-dependencies]
cq-testkit = { path = "../../testkit/cq-testkit" }
cq-sequence-conformance = { path = "conformance" }
cq-structure-selection = { path = "../../passes/cq-structure-selection" }
cq-load = { path = "../../runtime/cq-load", default-features = false }
cq-storage = { path = "../../runtime/cq-storage", features = ["counters"] }

[package.metadata.cq]
source = "cq-lang-sequence"
target = "rust"
printer = true
