[package]
name = "datalog-parallel-doop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "doop-parallel"
path = "src/main.rs"

[features]
default = ["mini", "mini-fx", "ascent", "mini-par", "mini-par-fx", "ascent-par"]
mini = ["dep:doop-mini"]
mini-fx = ["dep:doop-mini-fx"]
ascent = ["dep:doop-ascent"]
mini-par = ["dep:doop-mini-par"]
mini-par-fx = ["dep:doop-mini-par-fx"]
ascent-par = ["dep:doop-ascent-par"]
phase-timing = ["doop-mini?/phase-timing", "doop-mini-fx?/phase-timing", "doop-mini-par?/phase-timing", "doop-mini-par-fx?/phase-timing"]
hole-timing = ["doop-mini-par?/hole-timing", "doop-mini-par-fx?/hole-timing"]

[dependencies]
doop-shared = { path = "../../datalog/doop/shared" }
doop-mini = { path = "../../datalog/doop/engines/mini", optional = true }
doop-mini-fx = { path = "../../datalog/doop/engines/mini-fx", optional = true }
doop-ascent = { path = "../../datalog/doop/engines/ascent", optional = true }
doop-mini-par = { path = "engines/mini-par", optional = true }
doop-mini-par-fx = { path = "engines/mini-par-fx", optional = true }
doop-ascent-par = { path = "engines/ascent-par", optional = true }
rayon = "1"
