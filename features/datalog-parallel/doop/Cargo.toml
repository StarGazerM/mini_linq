[package]
name = "datalog-parallel-doop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "doop-parallel"
path = "src/main.rs"

[features]
default = ["mini", "mini-keyed", "ascent", "mini-par", "mini-par-keyed", "ascent-par"]
mini = ["dep:doop-mini"]
mini-keyed = ["dep:doop-mini-keyed"]
ascent = ["dep:doop-ascent"]
mini-par = ["dep:doop-mini-par"]
mini-par-keyed = ["dep:doop-mini-par-keyed"]
ascent-par = ["dep:doop-ascent-par"]
phase-timing = ["doop-mini?/phase-timing", "doop-mini-keyed?/phase-timing", "doop-mini-par?/phase-timing", "doop-mini-par-keyed?/phase-timing"]
hole-timing = ["doop-mini-par?/hole-timing", "doop-mini-par-keyed?/hole-timing"]

[dependencies]
doop-shared = { path = "../../datalog/doop/shared" }
doop-mini = { path = "../../datalog/doop/engines/mini", optional = true }
doop-mini-keyed = { path = "../../datalog/doop/engines/mini-keyed", optional = true }
doop-ascent = { path = "../../datalog/doop/engines/ascent", optional = true }
doop-mini-par = { path = "engines/mini-par", optional = true }
doop-mini-par-keyed = { path = "engines/mini-par-keyed", optional = true }
doop-ascent-par = { path = "engines/ascent-par", optional = true }
rayon = "1"
