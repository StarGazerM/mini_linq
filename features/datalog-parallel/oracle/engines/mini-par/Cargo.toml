[package]
name = "oracle-mini-par"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
phase-timing = ["cq-datalog-parallel/phase-timing"]
counters = ["cq-datalog-parallel/counters", "cq-storage/counters"]

[dependencies]
oracle-shared = { path = "../../../../datalog/oracle/shared" }
cq-datalog-parallel = { path = "../../.." }
cq-datalog-parallel-runtime = { path = "../../../runtime" }
cq-datalog = { path = "../../../../datalog/facade/cq-datalog" }
mini-linq = { version = "0.1.0", path = "../../../../../facade/mini-linq" }
cq-storage = { version = "0.1.0", path = "../../../../../runtime/cq-storage" }
rayon = "1"

[dev-dependencies]
cq-datalog-schedule = { path = "../../../../datalog/passes/schedule" }
oracle-ascent = { path = "../../../../datalog/oracle/engines/ascent" }
