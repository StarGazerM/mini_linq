[package]
name = "datalog-parallel-oracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "datalog-parallel-oracle"
path = "src/main.rs"

[features]
default = ["mini", "ascent", "mini-par", "ascent-par"]
mini = ["dep:oracle-mini"]
ascent = ["dep:oracle-ascent"]
mini-par = ["dep:oracle-mini-par"]
ascent-par = ["dep:oracle-ascent-par"]
phase-timing = ["oracle-mini?/phase-timing", "oracle-mini-par?/phase-timing"]
counters = ["oracle-shared/counters", "dep:cq-storage", "cq-storage/counters", "oracle-mini?/counters", "oracle-mini-par?/counters"]

[dependencies]
oracle-shared = { path = "../../datalog/oracle/shared" }
oracle-mini = { path = "../../datalog/oracle/engines/mini", optional = true }
oracle-ascent = { path = "../../datalog/oracle/engines/ascent", optional = true }
oracle-mini-par = { path = "engines/mini-par", optional = true }
oracle-ascent-par = { path = "engines/ascent-par", optional = true }
cq-storage = { version = "0.1.0", path = "../../../runtime/cq-storage", optional = true }
rayon = "1"
cq-testkit = { version = "0.1.0", path = "../../../testkit/cq-testkit", features = ["golden"] }
