[package]
name = "datalog-parallel-oracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "datalog-parallel-oracle"
path = "src/main.rs"

[features]
default = []
phase-timing = ["cq-datalog/phase-timing", "datalog-oracle/phase-timing"]
counters = ["cq-datalog/counters", "cq-storage/counters", "datalog-oracle/counters"]

[dependencies]
datalog-oracle = { path = "../../datalog/oracle" }
cq-datalog-parallel = { path = ".." }
cq-datalog-parallel-runtime = { path = "../runtime" }
cq-datalog = { path = "../../datalog/facade/cq-datalog" }
mini-linq = { version = "0.1.0", path = "../../../facade/mini-linq" }
cq-storage = { version = "0.1.0", path = "../../../runtime/cq-storage" }
ascent = { version = "0.8", default-features = false, features = ["par"] }
rayon = "1"
cq-testkit = { version = "0.1.0", path = "../../../testkit/cq-testkit", features = ["golden"] }
