[package]
name = "diverged-ra"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
members = ["ra-theta", "theta-passes"]
default-members = [".", "ra-theta", "theta-passes"]
resolver = "3"

[dependencies]
cq-storage = { version = "0.1.0", path = "../../runtime/cq-storage" }
theta-passes = { version = "0.0.0", path = "theta-passes" }

[build-dependencies]
ra-theta = { version = "0.0.0", path = "ra-theta" }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
cq-testkit = { version = "0.1.0", path = "../../testkit/cq-testkit" }
ra-theta = { version = "0.0.0", path = "ra-theta" }
syn = { version = "2", features = ["full", "extra-traits"] }
