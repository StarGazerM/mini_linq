[workspace]
members = ["languages/*", "passes/*", "support", "print", "facade/*", "oracle", "oracle/shared", "oracle/engines/*", "doop", "doop/shared", "doop/engines/*", "testkit", "test-passes"]
default-members = ["facade/cq-datalog"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cq-stage = { version = "0.1.0", path = "../../facade/cq-stage" }
cq-syntax = { version = "0.1.0", path = "../../languages/cq-syntax" }
cq-lang-cq = { version = "0.1.0", path = "../../languages/cq-lang-cq" }
mini-linq = { version = "0.1.0", path = "../../facade/mini-linq" }
cq-storage = { version = "0.1.0", path = "../../runtime/cq-storage" }
cq-rewrites = { version = "0.1.0", path = "../rewrites" }
rustc-hash = "=2.1.3"
cq-datalog-support = { version = "0.0.0", path = "support" }
cq-lang-datalog-source = { version = "0.0.0", path = "languages/dl-source" }
cq-lang-datalog-strata = { version = "0.0.0", path = "languages/dl-strata" }
cq-lang-datalog-incremental = { version = "0.0.0", path = "languages/dl-incremental" }
cq-lang-datalog-storage = { version = "0.0.0", path = "languages/dl-storage" }
cq-lang-datalog-round = { version = "0.0.0", path = "languages/dl-round" }
cq-datalog-surface-if-let = { version = "0.0.0", path = "passes/surface-if-let" }
cq-datalog-stratify = { version = "0.0.0", path = "passes/stratify" }
cq-datalog-incremental = { version = "0.0.0", path = "passes/incremental" }
cq-datalog-storage = { version = "0.0.0", path = "passes/storage" }
cq-datalog-hasher = { version = "0.0.0", path = "passes/hasher" }
cq-datalog-fork = { version = "0.0.0", path = "passes/fork" }
cq-datalog-print-rounds = { version = "0.0.0", path = "passes/print-rounds" }
cq-datalog-print = { version = "0.0.0", path = "print" }
cq-datalog-configuration = { version = "0.0.0", path = "facade/configuration" }
cq-datalog-macros = { version = "0.0.0", path = "facade/macros" }
cq-datalog = { version = "0.0.0", path = "facade/cq-datalog" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }

# Proc macros execute compiler passes even in otherwise unoptimized builds.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
