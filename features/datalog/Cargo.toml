[package]
name = "cq-datalog"
version = "0.0.0"
edition = "2024"
rust-version = "1.85.1"
publish = false

[workspace]
members = [".", "language", "schedule", "fork", "bridge", "oracle"]
resolver = "3"

# The frozen testkit exposes golden helpers only with bundled DuckDB.
[profile.dev.package.libduckdb-sys]
debug = false

[profile.test.package.libduckdb-sys]
debug = false

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
[workspace.dependencies]
cq-stage = { version = "0.1.0", path = "../../facade/cq-stage" }
cq-syntax = { version = "0.1.0", path = "../../languages/cq-syntax" }
cq-lang-cq = { version = "0.1.0", path = "../../languages/cq-lang-cq" }
mini-linq = { version = "0.1.0", path = "../../facade/mini-linq" }
cq-storage = { version = "0.1.0", path = "../../runtime/cq-storage" }
cq-lang-datalog = { version = "0.0.0", path = "language" }
cq-datalog-schedule = { version = "0.0.0", path = "schedule" }
cq-datalog-fork = { version = "0.0.0", path = "fork" }
datalog-bridge = { version = "0.0.0", path = "bridge" }
cq-datalog = { version = "0.0.0", path = "." }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }

[dependencies]
cq-lang-datalog.workspace = true
cq-datalog-schedule.workspace = true
cq-datalog-fork.workspace = true
datalog-bridge.workspace = true

[dev-dependencies]
mini-linq.workspace = true
cq-storage = { workspace = true, features = ["counters"] }
cq-stage.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
