[package]
name = "datalog-doop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "doop"
path = "src/main.rs"

[features]
default = []
phase-timing = ["cq-datalog/phase-timing"]

[dependencies]
ascent = { version = "0.8", default-features = false }
ahash = "0.8"
cq-datalog.workspace = true
cq-datalog-hasher = { path = "../passes/hasher" }
cq-rewrites = { path = "../../rewrites" }
rustc-hash = "2.1.3"
mini-linq.workspace = true
cq-storage.workspace = true
libc = "0.2"
