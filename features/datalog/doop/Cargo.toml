[package]
name = "datalog-doop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "doop"
path = "src/main.rs"

[features]
default = ["mini", "mini-fx", "ascent"]
mini = ["dep:doop-mini"]
mini-fx = ["dep:doop-mini-fx"]
ascent = ["dep:doop-ascent"]
phase-timing = ["doop-mini?/phase-timing", "doop-mini-fx?/phase-timing"]

[dependencies]
doop-shared = { path = "shared" }
doop-mini = { path = "engines/mini", optional = true }
doop-mini-fx = { path = "engines/mini-fx", optional = true }
doop-ascent = { path = "engines/ascent", optional = true }
