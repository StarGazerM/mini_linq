[package]
name = "datalog-doop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "doop"
path = "src/main.rs"

[features]
default = ["mini", "mini-keyed", "ascent"]
mini = ["dep:doop-mini"]
mini-keyed = ["dep:doop-mini-keyed"]
ascent = ["dep:doop-ascent"]
phase-timing = ["doop-mini?/phase-timing", "doop-mini-keyed?/phase-timing"]

[dependencies]
doop-shared = { path = "shared" }
doop-mini = { path = "engines/mini", optional = true }
doop-mini-keyed = { path = "engines/mini-keyed", optional = true }
doop-ascent = { path = "engines/ascent", optional = true }
