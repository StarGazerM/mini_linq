[package]
name = "srd-doop-harness"
version = "0.1.0"
edition = "2024"
publish = false

[features]
planner-calibration = ["dep:cq-cost", "cq-cost/planner-calibration", "dep:cq-load", "dep:cq-syntax", "srd-doop-shared/planner-calibration"]

[dependencies]
bench-check = { path = "../../../../../testkit/bench-check" }
srd-doop-shared = { path = "../../srd" }
serde_json = "1"
cq-cost = { path = "../../../../planners/cost", optional = true }
cq-load = { workspace = true, optional = true }
cq-syntax = { workspace = true, optional = true }
