[package]
name = "cq-datalog"
version = "0.0.0"
edition.workspace = true
rust-version = "1.85.1"
license.workspace = true
publish = false

[features]
default = []
counters = ["cq-storage/counters"]
# The proc macro resolves host-side features separately: forward to it too.
phase-timing = ["cq-datalog-configuration/phase-timing", "cq-datalog-macros/phase-timing"]
hoist-invariants = ["cq-datalog-macros/hoist-invariants"]
planner-calibration = ["cq-storage/planner-calibration", "cq-datalog-macros/planner-calibration", "dep:cq-cost", "cq-cost/planner-calibration"]

[dependencies]
cq-datalog-configuration.workspace = true
cq-datalog-macros.workspace = true
cq-lang-datalog-source.workspace = true
cq-lang-datalog-strata.workspace = true
cq-lang-datalog-incremental.workspace = true
cq-lang-datalog-storage.workspace = true
cq-lang-datalog-round.workspace = true
cq-storage.workspace = true
cq-cost = { path = "../../../planners/cost", optional = true }
rustc-hash.workspace = true
own-push.workspace = true

[dev-dependencies]
mini-linq.workspace = true
cq-load.workspace = true
cq-stage.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
cq-syntax.workspace = true
serde_json.workspace = true
cq-datalog-test-passes = { path = "../../test-passes" }
cq-datalog-testkit = { path = "../../testkit" }
cq-datalog-parallel = { path = "../../../datalog-parallel" }
cq-datalog-parallel-runtime = { path = "../../../datalog-parallel/runtime" }
cq-datalog-partition = { path = "../../../datalog-parallel/partition" }
cq-datalog-stratify.workspace = true
cq-datalog-incremental.workspace = true
cq-datalog-storage.workspace = true
cq-datalog-fork.workspace = true
cq-planning.workspace = true
rayon = "1"
ascent = { version = "0.8", default-features = false }

[[test]]
name = "execution"
path = "../../tests/execution.rs"

[[test]]
name = "per_hole"
path = "../../tests/per_hole.rs"

[[test]]
name = "reference_round"
path = "../../tests/reference_round.rs"

[[test]]
name = "counters"
path = "../../tests/counters.rs"
required-features = ["counters"]

[[test]]
name = "calibration"
path = "../../tests/calibration.rs"
required-features = ["planner-calibration"]

[[example]]
name = "reach"
path = "../../examples/reach.rs"

[[example]]
name = "layout_mismatch"
path = "../../examples/layout_mismatch.rs"
required-features = ["counters"]

[[test]]
name = "calibration_workflow"
path = "../../tests/calibration_workflow.rs"
required-features = ["planner-calibration"]

[[test]]
name = "calibration_erasure"
path = "../../tests/calibration_erasure.rs"
