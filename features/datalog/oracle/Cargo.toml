[package]
name = "datalog-oracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Sequential Ascent differential oracle for feature-local Datalog"

[features]
default = ["mini", "mini-keyed", "ascent"]
mini = ["dep:oracle-mini"]
mini-keyed = ["dep:oracle-mini-keyed"]
ascent = ["dep:oracle-ascent"]
counters = ["oracle-shared/counters", "oracle-mini?/counters", "oracle-mini-keyed?/counters"]
phase-timing = ["oracle-mini?/phase-timing", "oracle-mini-keyed?/phase-timing"]

[dependencies]
oracle-shared = { path = "shared" }
oracle-mini = { path = "engines/mini", optional = true }
oracle-mini-keyed = { path = "engines/mini-keyed", optional = true }
oracle-ascent = { path = "engines/ascent", optional = true }
cq-storage = { path = "../../../runtime/cq-storage" }
cq-testkit = { version = "0.1.0", path = "../../../testkit/cq-testkit", features = ["golden"] }

[dev-dependencies]
ascent = { version = "0.8", default-features = false }
cq-datalog = { path = "../facade/cq-datalog" }
mini-linq = { path = "../../../facade/mini-linq" }
cq-datalog-testkit = { path = "../testkit" }
cq-datalog-test-passes = { path = "../test-passes" }
