[package]
name = "stacked-ir"
version = "0.0.0"
edition = "2024"
rust-version = "1.85.1"
publish = false

[workspace]
members = [".", "trace", "physical-to-trace", "trace-to-physical", "bridge", "test-passes"]
default-members = [".", "trace", "physical-to-trace", "trace-to-physical", "bridge", "test-passes"]
resolver = "3"

[workspace.dependencies]
cq-stage = { version = "0.1.0", path = "../../facade/cq-stage" }
cq-lang-cq = { version = "0.1.0", path = "../../languages/cq-lang-cq" }
cq-lang-ra = { version = "0.1.0", path = "../../languages/cq-lang-ra" }
cq-lang-physical = { version = "0.1.0", path = "../../languages/cq-lang-physical" }
cq-lang-structures = { version = "0.1.0", path = "../../languages/cq-lang-structures" }
cq-order = { version = "0.1.0", path = "../../passes/cq-order" }
cq-reduce = { version = "0.1.0", path = "../../passes/cq-reduce" }
cq-elaborate = { version = "0.1.0", path = "../../passes/cq-elaborate" }
cq-structure-selection = { version = "0.1.0", path = "../../passes/cq-structure-selection" }
cq-physical-realization = { version = "0.1.0", path = "../../passes/cq-physical-realization" }
cq-storage = { version = "0.1.0", path = "../../runtime/cq-storage" }
cq-testkit = { version = "0.1.0", path = "../../testkit/cq-testkit" }
mini-linq = { version = "0.1.0", path = "../../facade/mini-linq" }
cq-lang-trace = { version = "0.0.0", path = "trace" }
physical-to-trace = { version = "0.0.0", path = "physical-to-trace" }
trace-to-physical = { version = "0.0.0", path = "trace-to-physical" }
trace-bridge = { version = "0.0.0", path = "bridge" }
stacked-ir-test-passes = { version = "0.0.0", path = "test-passes" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dependencies]
cq-lang-trace.workspace = true
physical-to-trace.workspace = true
trace-to-physical.workspace = true
trace-bridge.workspace = true

[dev-dependencies]
cq-stage.workspace = true
cq-structure-selection.workspace = true
cq-physical-realization.workspace = true
cq-storage.workspace = true
cq-testkit.workspace = true
mini-linq.workspace = true
stacked-ir-test-passes.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
