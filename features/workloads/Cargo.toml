[package]
name = "cq-workloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[workspace]
members = [".", "e2e", "e2e/corpus", "xtask", "pipeline-passes"]
default-members = [".", "e2e", "e2e/corpus", "xtask", "pipeline-passes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cq-load = { version = "0.1.0", path = "../../runtime/cq-load" }
cq-storage = { version = "0.1.0", path = "../../runtime/cq-storage" }
cq-testkit = { version = "0.1.0", path = "../../testkit/cq-testkit" }
cq-lang-cq = { version = "0.1.0", path = "../../languages/cq-lang-cq" }
cq-lang-ra = { version = "0.1.0", path = "../../languages/cq-lang-ra" }
cq-lang-vo = { version = "0.1.0", path = "../../languages/cq-lang-vo" }
cq-lang-ix = { version = "0.1.0", path = "../../languages/cq-lang-ix" }
cq-lang-physical = { version = "0.1.0", path = "../../languages/cq-lang-physical" }
cq-lang-structures = { version = "0.1.0", path = "../../languages/cq-lang-structures" }
cq-syntax = { version = "0.1.0", path = "../../languages/cq-syntax" }
cq-stage = { version = "0.1.0", path = "../../facade/cq-stage" }
mini-linq = { version = "0.1.0", path = "../../facade/mini-linq" }
cq-order = { version = "0.1.0", path = "../../passes/cq-order" }
cq-reduce = { version = "0.1.0", path = "../../passes/cq-reduce" }
cq-elaborate = { version = "0.1.0", path = "../../passes/cq-elaborate" }
cq-index-policy = { version = "0.1.0", path = "../../passes/cq-index-policy" }
cq-physical-lowering = { version = "0.1.0", path = "../../passes/cq-physical-lowering" }
cq-structure-selection = { version = "0.1.0", path = "../../passes/cq-structure-selection" }
cq-physical-realization = { version = "0.1.0", path = "../../passes/cq-physical-realization" }
cq-planners = { path = "../planners" }
cq-planners-plan = { path = "../planners/plan" }
cq-rewrites = { path = "../rewrites" }
cq-workload-passes = { path = "pipeline-passes" }
cq-rewrite-passes = { path = "../rewrites/passes" }
own-push = { path = "../own-dialect/printer" }
cq-ext-support = { path = "../extensions/cq-ext-support" }
cq-ext-union = { path = "../extensions/cq-ext-union" }
cq-ext-negation = { path = "../extensions/cq-ext-negation" }
cq-ext-aggregate = { path = "../extensions/cq-ext-aggregate" }
cq-ext-recursion = { path = "../extensions/cq-ext-recursion" }
cq-ext-correlated = { path = "../extensions/cq-ext-correlated" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full", "visit", "visit-mut"] }
prettyplease = "0.2"

[profile.dev.package.libduckdb-sys]
debug = false

[profile.test.package.libduckdb-sys]
debug = false

# The generated pipeline matrix is large; keep every case without debug data.
[profile.dev.package.cq-workload-corpus]
debug = 0

[profile.test.package.cq-workload-corpus]
debug = 0

[profile.dev.package.cq-workload-e2e]
debug = 0

[profile.test.package.cq-workload-e2e]
debug = 0

[dependencies]
cq-load.workspace = true
cq-lang-cq.workspace = true
cq-syntax.workspace = true
mini-linq.workspace = true
syn.workspace = true
cq-ext-support.workspace = true
proc-macro2.workspace = true
quote.workspace = true
cq-ext-negation.workspace = true
cq-ext-recursion.workspace = true
cq-storage.workspace = true
cq-planners-plan.workspace = true
cq-rewrite-passes.workspace = true
cq-planners.workspace = true
cq-rewrites.workspace = true
cq-workload-passes.workspace = true
cq-index-policy.workspace = true
cq-physical-lowering.workspace = true
cq-structure-selection.workspace = true
cq-lang-physical.workspace = true
cq-lang-structures.workspace = true

[dev-dependencies]
cq-testkit.workspace = true

[features]
default = []
counters = ["cq-storage/counters"]

[[test]]
name = "growth"
required-features = ["counters"]
