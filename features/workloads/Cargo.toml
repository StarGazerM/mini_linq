[package]
name = "cq-workloads"
version.workspace = true
edition.workspace = true
rust-version = "1.85.1"
license.workspace = true

[dependencies]
cq-workload-authored = { path = "authored" }
cq-testkit.workspace = true
cq-load.workspace = true
cq-lang-cq.workspace = true
cq-syntax.workspace = true
mini-linq.workspace = true
syn.workspace = true
proc-macro2.workspace = true
quote.workspace = true
cq-ext-recursion.workspace = true
cq-ext-aggregate.workspace = true
cq-ext-correlated.workspace = true
cq-storage.workspace = true
cq-planners-plan.workspace = true
cq-rewrite-passes.workspace = true
cq-planners.workspace = true
cq-rewrites.workspace = true
cq-join-filters.workspace = true
cq-workload-passes.workspace = true
cq-index-policy.workspace = true
cq-physical-lowering.workspace = true
cq-structure-selection.workspace = true
cq-lang-physical.workspace = true
cq-lang-structures.workspace = true


[dev-dependencies]
cq-lang-sequence.workspace = true
cq-sequence-lowering.workspace = true
cq-sequence-pull.workspace = true
cq-testkit = { workspace = true, features = ["duckdb"] }
cq-load = { workspace = true, features = ["parquet"] }
# Generated `par` configurations link the Tasks runtime and Rayon.
cq-sequence-tasks.workspace = true
cq-sequence-tasks-macros.workspace = true
rayon = "1"

[features]
default = []
counters = ["cq-storage/counters"]
parquet = ["cq-load/parquet"]

[[test]]
name = "growth"
required-features = ["counters"]
