[package]
name = "cq-workload-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
proc-macro = true

[features]
default = []
parquet = ["cq-load/parquet"]

[[bench]]
name = "load"
harness = false
required-features = ["parquet"]

[dependencies]
cq-workloads = { path = ".." }
cq-lang-cq.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
cq-testkit.workspace = true
cq-load.workspace = true
mini-linq.workspace = true
cq-storage.workspace = true
cq-planners.workspace = true
cq-rewrites.workspace = true
cq-workload-passes.workspace = true
own-push.workspace = true
cq-ext-union.workspace = true
cq-ext-negation.workspace = true
cq-ext-aggregate.workspace = true
cq-ext-recursion.workspace = true
cq-ext-correlated.workspace = true
