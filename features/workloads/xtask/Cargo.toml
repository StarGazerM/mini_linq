[package]
name = "cq-xtask"
version.workspace = true
edition.workspace = true
rust-version = "1.85.1"
license.workspace = true
publish = false

[features]
default = ["oracle"]
oracle = ["cq-testkit/duckdb"]
counters = ["cq-workloads/counters"]

[dependencies]
bench-check = { path = "../../../tools/bench-check" }
cq-workloads = { path = ".." }
cq-testkit.workspace = true
cq-lang-cq.workspace = true
cq-lang-ra.workspace = true
quote.workspace = true
syn.workspace = true
serde_json = "1"

[dev-dependencies]
cq-order.workspace = true
cq-relational-lowering.workspace = true
