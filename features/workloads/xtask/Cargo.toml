[package]
name = "cq-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
oracle = ["dep:duckdb", "cq-testkit/duckdb"]
counters = ["cq-workloads/counters"]

[dependencies]
cq-workloads = { path = ".." }
cq-testkit.workspace = true
cq-lang-cq.workspace = true
cq-lang-ra.workspace = true
quote.workspace = true
syn.workspace = true
duckdb = { version = "=1.10505.0", features = ["bundled", "parquet"], optional = true }
serde_json = "1"

[dev-dependencies]
cq-order.workspace = true
cq-elaborate.workspace = true
