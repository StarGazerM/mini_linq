[package]
name = "cq-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
oracle = ["dep:duckdb", "dep:serde_json", "cq-testkit/duckdb"]
counters = ["cq-workloads/counters"]

[dependencies]
cq-workloads = { path = ".." }
cq-testkit.workspace = true
cq-lang-cq.workspace = true
cq-lang-ix.workspace = true
cq-lang-ra.workspace = true
cq-index-policy.workspace = true
cq-physical-lowering.workspace = true
cq-structure-selection.workspace = true
cq-physical-realization.workspace = true
cq-planners-plan.workspace = true
quote.workspace = true
syn.workspace = true
duckdb = { version = "=1.10505.0", features = ["bundled", "parquet"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
cq-order.workspace = true
cq-elaborate.workspace = true
