
[package]
name = "cq-rewrites"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Checked Physical and Structures rewrite macros for MiniLinq"

[lib]
proc-macro = true

[dependencies]
cq-stage = { version = "0.1.0", path = "../../facade/cq-stage" }
cq-lang-physical = { version = "0.1.0", path = "../../languages/cq-lang-physical" }
cq-lang-structures = { version = "0.1.0", path = "../../languages/cq-lang-structures" }
cq-rewrite-passes = { version = "0.1.0", path = "passes" }
cq-structure-selection = { version = "0.1.0", path = "../../passes/cq-structure-selection" }

[dev-dependencies]
cq-planners = { version = "0.1.0", path = "../planners" }
cq-physical-lowering = { version = "0.1.0", path = "../../passes/cq-physical-lowering" }
cq-testkit = { version = "0.1.0", path = "../../testkit/cq-testkit" }
cq-rewrite-test-driver = { version = "0.1.0", path = "test-driver" }
cq-storage = { version = "0.1.0", path = "../../runtime/cq-storage", features = ["counters"] }
cq-load = { version = "0.1.0", path = "../../runtime/cq-load" }
# Core passes of the generated rewrite-stage driver (tests/rewrite_stages.rs).
cq-lang-cq = { version = "0.1.0", path = "../../languages/cq-lang-cq" }
cq-lang-ix = { version = "0.1.0", path = "../../languages/cq-lang-ix" }
cq-order = { version = "0.1.0", path = "../../passes/cq-order" }
cq-reduce = { version = "0.1.0", path = "../../passes/cq-reduce" }
cq-relational-lowering = { version = "0.1.0", path = "../../passes/cq-relational-lowering" }
cq-index-policy = { version = "0.1.0", path = "../../passes/cq-index-policy" }
mini-linq = { version = "0.1.0", path = "../../facade/mini-linq" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

# Generated stage differential and checker mutants through the rewrites:
# opt-in, only run when selected with `--test rewrite_stages`.
[[test]]
name = "rewrite_stages"
test = false
