[package]
name = "cq-rewrite-passes"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Public checked transformations underlying cq-rewrites"

[dependencies]
cq-lang-physical = { version = "0.1.0", path = "../../../languages/cq-lang-physical" }
cq-lang-structures = { version = "0.1.0", path = "../../../languages/cq-lang-structures" }
proc-macro2 = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
