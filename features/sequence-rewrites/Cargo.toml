[workspace]
members = ["."]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
cq-stage = { version = "0.1.0", path = "../../facade/cq-stage" }
cq-lang-sequence = { version = "0.1.0", path = "../../languages/cq-lang-sequence" }
cq-syntax = { version = "0.1.0", path = "../../languages/cq-syntax" }
cq-sequence-plan = { version = "0.1.0", path = "../../passes/cq-sequence-plan" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[package]
name = "cq-sequence-rewrites"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Checked Sequence scheduling rewrite macros for MiniLinq"

[package.metadata.cq]
source = "cq-lang-sequence"
target = "cq-lang-sequence"

[lib]
proc-macro = true

[dependencies]
cq-stage.workspace = true
cq-lang-sequence.workspace = true
cq-sequence-plan.workspace = true

[dev-dependencies]
cq-syntax.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
cq-sequence-lowering = { path = "../../passes/cq-sequence-lowering" }
cq-structure-selection = { path = "../../passes/cq-structure-selection" }
cq-rewrite-passes = { path = "../rewrites/passes" }
cq-workloads = { path = "../workloads" }
