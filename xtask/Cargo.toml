[package]
name = "cq-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

# Keep the heavyweight DuckDB client out of the ordinary teaching workspace.
[workspace]

[features]
default = []
oracle = ["dep:duckdb"]

[dependencies]
cq-compose = { path = "../crates/cq-compose" }
cq-physical = { path = "../crates/cq-physical", default-features = false, features = ["input", "lazy"] }
cq-pull = { path = "../crates/cq-pull" }
cq-pipeline = { path = "../crates/cq-pipeline", default-features = false, features = ["iterator"] }
cq-ir = { path = "../crates/cq-ir" }
cq-workloads = { path = "../workloads" }
duckdb = { version = "~1.10505.0", features = ["bundled"], optional = true }
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full", "visit-mut"] }
