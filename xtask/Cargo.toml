[package]
name = "cq-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

# Keep the heavyweight DuckDB client out of the ordinary teaching workspace.
[workspace]

[features]
default = []
oracle = ["dep:duckdb"]

[dependencies]
cq-query-lowering = { path = "../crates/cq-query-lowering", default-features = false, features = ["written-order", "clause-prefix", "hypergraph"] }
cq-index-policy = { path = "../crates/cq-index-policy" }
cq-ir = { path = "../crates/cq-ir" }
cq-workloads = { path = "../workloads" }
duckdb = { version = "~1.10505.0", features = ["bundled"], optional = true }
quote = "1"
syn = { version = "2", features = ["extra-traits", "full"] }

[dev-dependencies]
proc-macro2 = "1"
prettyplease = "0.2"
syn = { version = "2", features = ["visit-mut"] }
cq-access-lowering = { path = "../crates/cq-access-lowering", default-features = false, features = ["to-pipeline"] }
cq-pipeline-lowering = { path = "../crates/cq-pipeline-lowering", default-features = false, features = ["distinct-iter"] }
