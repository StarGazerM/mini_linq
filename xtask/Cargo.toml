[package]
name = "cq-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
publish = false

# Keep the heavyweight DuckDB client out of the ordinary teaching workspace.
[workspace]

[features]
default = []
oracle = ["dep:duckdb"]

[dependencies]
cq-lang-vo = { path = "../languages/cq-lang-vo" }
cq-lang-cq = { path = "../languages/cq-lang-cq" }
cq-lang-ix = { path = "../languages/cq-lang-ix" }
cq-lang-ra = { path = "../languages/cq-lang-ra" }
cq-elaborate = { path = "../passes/cq-elaborate" }
cq-index-policy = { path = "../passes/cq-index-policy" }
cq-order = { path = "../passes/cq-order" }
cq-workloads = { path = "../workloads", features = ["counters"] }
duckdb = { version = "~1.10505.0", features = ["bundled"], optional = true }
quote = "1"
syn = { version = "2", features = ["extra-traits", "full"] }

[dev-dependencies]
proc-macro2 = "1"
prettyplease = "0.2"
syn = { version = "2", features = ["visit-mut"] }
