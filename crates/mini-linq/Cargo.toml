[package]
name = "mini-linq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[features]
default = ["defaults", "canonical", "prefix", "graph", "input-indexes", "result-indexes", "hash-inputs", "hash-prefix", "hash-materialized", "relations", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-witnesses", "nested-witnesses", "hash-pairs", "nested-pairs", "sort-merge-pairs", "hash-rows", "sorted-rows", "tuple-hash-rows", "tuple-sorted-rows", "block-rows", "pull", "push-set", "iterator-pipeline", "collect-pipeline", "stream-pipeline"]
hw4 = []
compiled-workloads = ["defaults"]
defaults = ["dep:cq-compose", "canonical", "prefix", "graph", "input-indexes", "result-indexes", "hash-inputs", "hash-prefix", "hash-materialized", "pull", "iterator-pipeline", "collect-pipeline"]
canonical = ["dep:cq-plan", "cq-plan/canonical"]
prefix = ["dep:cq-plan", "cq-plan/prefix"]
graph = ["dep:cq-plan", "cq-plan/graph"]
input-indexes = ["dep:cq-index", "cq-index/input"]
result-indexes = ["dep:cq-index", "cq-index/result"]
hash-inputs = ["dep:cq-realize", "cq-realize/hash-inputs"]
hash-prefix = ["dep:cq-realize", "cq-realize/hash-prefix"]
hash-materialized = ["dep:cq-realize", "cq-realize/hash-materialized"]
relations = ["dep:cq-realize", "cq-realize/relations"]
scan-rows = ["dep:cq-native", "cq-native/candidate-scan"]
prune-rows = ["dep:cq-native", "cq-native/candidate-prune"]
exact-keys = ["dep:cq-native", "cq-native/keys-exact"]
zone-keys = ["dep:cq-native", "cq-native/keys-zone"]
hash-witnesses = ["dep:cq-native", "cq-native/witness-hash"]
nested-witnesses = ["dep:cq-native", "cq-native/witness-nested"]
hash-pairs = ["dep:cq-native", "cq-native/pairs-hash"]
nested-pairs = ["dep:cq-native", "cq-native/pairs-nested"]
sort-merge-pairs = ["dep:cq-native", "cq-native/pairs-merge"]
hash-rows = ["dep:cq-native", "cq-native/rows-hash"]
sorted-rows = ["dep:cq-native", "cq-native/rows-sorted"]
block-rows = ["dep:cq-native", "cq-native/rows-block"]
tuple-hash-rows = ["dep:cq-native", "cq-native/rows-tuple-hash"]
tuple-sorted-rows = ["dep:cq-native", "cq-native/rows-tuple-sorted"]
pull = ["dep:cq-execution", "cq-execution/pull"]
push-set = ["dep:cq-execution", "cq-execution/push"]
iterator-pipeline = ["dep:cq-pipeline", "cq-pipeline/iterator"]
collect-pipeline = ["dep:cq-pipeline", "cq-pipeline/collect"]
stream-pipeline = ["dep:cq-pipeline", "cq-pipeline/stream"]

[dependencies]
syn_derive.workspace = true
proc-macro2.workspace = true
cq-ir.workspace = true
quote.workspace = true
syn.workspace = true
cq-compose = { workspace = true, optional = true }
cq-plan = { workspace = true, optional = true }
cq-index = { workspace = true, optional = true }
cq-realize = { workspace = true, optional = true }
cq-native = { workspace = true, optional = true }
cq-execution = { workspace = true, optional = true }
cq-pipeline = { workspace = true, optional = true }

[dev-dependencies]
cq-storage.workspace = true
cq-plan = { workspace = true, features = ["prefix", "graph"] }

[[example]]
name = "blocked-ya"
path = "../../examples/blocked-ya/main.rs"
required-features = ["relations", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-pairs", "hash-rows", "sorted-rows", "block-rows", "pull", "stream-pipeline"]
test = true
harness = false

[[example]]
name = "rust-expressions"
path = "../../examples/rust-expressions/main.rs"
required-features = ["compiled-workloads"]
test = true
harness = false

[[example]]
name = "rust-expressions-planned"
path = "../../examples/rust-expressions/planned.rs"
required-features = ["compiled-workloads"]
test = true
harness = false

[[example]]
name = "negation-aggregation"
path = "../../examples/negation-aggregation/main.rs"
required-features = ["hw4", "defaults"]

# Multi-stage tests state their full macro composition. Native boundary tests
# instead gate individual cases so selected implementations remain executable.

[[test]]
name = "access_refinement"
required-features = ["relations", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-pairs", "hash-witnesses", "nested-witnesses", "hash-rows", "block-rows", "pull", "collect-pipeline", "stream-pipeline"]

[[test]]
name = "block_access"
required-features = ["defaults", "relations", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-pairs", "block-rows", "stream-pipeline"]

[[test]]
name = "collect_endpoints"
required-features = ["pull", "collect-pipeline"]

[[test]]
name = "composition"
required-features = ["defaults"]

[[test]]
name = "macro_routing"
required-features = ["defaults"]

[[test]]
name = "empty_bindings"
required-features = ["defaults"]

[[test]]
name = "endpoint"
required-features = ["pull", "iterator-pipeline"]

[[test]]
name = "formal_counterexamples"
required-features = ["defaults"]

[[test]]
name = "heterogeneous"
required-features = ["relations", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-pairs", "nested-pairs", "hash-rows", "sorted-rows", "block-rows", "pull", "stream-pipeline"]

[[test]]
name = "hw4_optional"
required-features = ["hw4", "defaults"]

[[test]]
name = "planned_queries"
required-features = ["defaults"]

[[test]]
name = "provider_provenance"
required-features = ["block-rows", "hash-rows"]

[[test]]
name = "reference_hygiene"
required-features = ["compiled-workloads"]

[[test]]
name = "reusable_query"
required-features = ["defaults"]

[[test]]
name = "rust_expressions"
required-features = ["defaults"]

[[test]]
name = "stage_boundaries"
required-features = ["defaults"]

[[test]]
name = "storage_traits"
required-features = ["relations", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-pairs", "hash-rows", "sorted-rows", "block-rows", "pull", "stream-pipeline"]

[[test]]
name = "typed_relations"
required-features = ["compiled-workloads"]

[[test]]
name = "pair_algorithms"
required-features = ["hash-pairs", "nested-pairs", "sort-merge-pairs", "hash-rows", "sorted-rows"]

[[test]]
name = "physical_typed"
required-features = ["relations", "tuple-hash-rows", "tuple-sorted-rows", "block-rows", "hash-pairs", "scan-rows", "exact-keys", "zone-keys", "prune-rows", "pull", "collect-pipeline", "stream-pipeline"]

[[test]]
name = "relation_configuration"
required-features = ["relations", "tuple-hash-rows", "hash-pairs"]

[[test]]
name = "borrowed_reads"
required-features = ["relations", "tuple-hash-rows", "tuple-sorted-rows", "scan-rows", "exact-keys", "pull", "stream-pipeline", "hash-pairs", "nested-pairs", "sort-merge-pairs"]
