[package]
name = "mini-linq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[features]
default = ["logical-selection", "written-order", "clause-prefix", "hypergraph", "index-demands", "structure-selection", "physical-lowering", "physical-realization"]
logical-selection = ["written-order", "clause-prefix", "hypergraph"]
written-order = ["dep:cq-query-lowering", "cq-query-lowering/written-order"]
clause-prefix = ["dep:cq-query-lowering", "cq-query-lowering/clause-prefix"]
hypergraph = ["dep:cq-query-lowering", "cq-query-lowering/hypergraph"]
index-demands = ["dep:cq-index-policy"]
structure-selection = ["dep:cq-structure-selection"]
physical-lowering = ["dep:cq-physical-lowering"]
physical-realization = ["dep:cq-physical-realization"]

[dependencies]
proc-macro2.workspace = true
cq-ir.workspace = true
quote.workspace = true
syn.workspace = true
cq-query-lowering = { workspace = true, optional = true }
cq-index-policy = { workspace = true, optional = true }
cq-structure-selection = { workspace = true, optional = true }
cq-physical-lowering = { workspace = true, optional = true }
cq-physical-realization = { workspace = true, optional = true }

[dev-dependencies]
cq-state-providers.workspace = true
syn_derive.workspace = true
cq-storage.workspace = true
contracts.workspace = true
prettyplease.workspace = true
syn = { workspace = true, features = ["visit-mut"] }





[[test]]
name = "physical_query"
required-features = ["written-order", "clause-prefix", "hypergraph", "index-demands", "physical-lowering", "structure-selection", "physical-realization"]
