[package]
name = "mini-linq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[features]
default = ["logical-selection", "written-order", "clause-prefix", "hypergraph", "index-demands", "stream-lowering", "stream-realization", "access-to-pipeline", "access-to-set-loops", "pipeline-distinct-iter", "pipeline-set", "pipeline-support-iter", "pipeline-exists"]
logical-selection = ["written-order", "clause-prefix", "hypergraph"]
written-order = ["dep:cq-query-lowering", "cq-query-lowering/written-order"]
clause-prefix = ["dep:cq-query-lowering", "cq-query-lowering/clause-prefix"]
hypergraph = ["dep:cq-query-lowering", "cq-query-lowering/hypergraph"]
index-demands = ["dep:cq-index-policy"]
stream-lowering = ["dep:cq-stream-lowering"]
stream-realization = ["dep:cq-stream-realization"]
access-to-pipeline = ["dep:cq-access-lowering", "cq-access-lowering/to-pipeline"]
access-to-set-loops = ["dep:cq-access-lowering", "cq-access-lowering/to-set-loops"]
pipeline-distinct-iter = ["dep:cq-pipeline-lowering", "cq-pipeline-lowering/distinct-iter"]
pipeline-set = ["dep:cq-pipeline-lowering", "cq-pipeline-lowering/collect-set"]
pipeline-support-iter = ["dep:cq-pipeline-lowering", "cq-pipeline-lowering/support-iter"]
pipeline-exists = ["dep:cq-pipeline-lowering", "cq-pipeline-lowering/exists"]

[dependencies]
proc-macro2.workspace = true
cq-ir.workspace = true
quote.workspace = true
syn.workspace = true
cq-query-lowering = { workspace = true, optional = true }
cq-index-policy = { workspace = true, optional = true }
cq-stream-lowering = { workspace = true, optional = true }
cq-stream-realization = { workspace = true, optional = true }
cq-access-lowering = { workspace = true, optional = true }
cq-pipeline-lowering = { workspace = true, optional = true }

[dev-dependencies]
cq-state-providers.workspace = true
syn_derive.workspace = true
cq-storage.workspace = true
contracts.workspace = true
prettyplease.workspace = true
syn = { workspace = true, features = ["visit-mut"] }

[[test]]
name = "collect_endpoints"
required-features = ["access-to-pipeline", "pipeline-set"]

[[test]]
name = "endpoint"
required-features = ["access-to-pipeline", "pipeline-distinct-iter"]

[[test]]
name = "execution_models"
required-features = ["access-to-pipeline", "access-to-set-loops", "pipeline-set"]

[[test]]
name = "state_providers"
required-features = ["pipeline-distinct-iter", "pipeline-set", "pipeline-support-iter", "pipeline-exists", "access-to-set-loops"]

[[test]]
name = "stream_query"
required-features = ["written-order", "hypergraph", "index-demands", "stream-lowering", "stream-realization", "access-to-pipeline", "access-to-set-loops", "pipeline-distinct-iter", "pipeline-set", "pipeline-support-iter"]
