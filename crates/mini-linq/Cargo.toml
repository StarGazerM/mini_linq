[package]
name = "mini-linq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[features]
default = ["defaults", "canonical", "prefix", "graph", "input-indexes", "result-indexes", "input-indexed", "lazy", "materialized", "physical", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-witnesses", "nested-witnesses", "hash-rows", "sorted-rows", "block-rows", "pull", "iterator-pipeline", "collect-pipeline", "stream-pipeline"]
hw4 = []
compiled-workloads = ["defaults"]
defaults = ["dep:cq-compose", "canonical", "prefix", "graph", "input-indexes", "result-indexes", "input-indexed", "lazy", "materialized", "pull", "iterator-pipeline", "collect-pipeline"]
canonical = ["dep:cq-plan", "cq-plan/canonical"]
prefix = ["dep:cq-plan", "cq-plan/prefix"]
graph = ["dep:cq-plan", "cq-plan/graph"]
input-indexes = ["dep:cq-index", "cq-index/input"]
result-indexes = ["dep:cq-index", "cq-index/result"]
input-indexed = ["dep:cq-physical", "cq-physical/input"]
lazy = ["dep:cq-physical", "cq-physical/lazy"]
materialized = ["dep:cq-physical", "cq-physical/materialized"]
physical = ["dep:cq-physical", "cq-physical/direct"]
scan-rows = ["dep:cq-access", "cq-access/candidate-scan"]
prune-rows = ["dep:cq-access", "cq-access/candidate-prune"]
exact-keys = ["dep:cq-access", "cq-access/keys-exact"]
zone-keys = ["dep:cq-access", "cq-access/keys-zone"]
hash-witnesses = ["dep:cq-access", "cq-access/witness-hash"]
nested-witnesses = ["dep:cq-access", "cq-access/witness-nested"]
hash-rows = ["dep:cq-providers", "cq-providers/hash"]
sorted-rows = ["dep:cq-providers", "cq-providers/sorted"]
block-rows = ["dep:cq-providers", "cq-providers/block"]
pull = ["dep:cq-pull"]
iterator-pipeline = ["dep:cq-pipeline", "cq-pipeline/iterator"]
collect-pipeline = ["dep:cq-pipeline", "cq-pipeline/collect"]
stream-pipeline = ["dep:cq-pipeline", "cq-pipeline/stream"]

[dependencies]
syn_derive.workspace = true
proc-macro2.workspace = true
cq-ir.workspace = true
quote.workspace = true
syn.workspace = true
cq-compose = { workspace = true, optional = true }
cq-plan = { workspace = true, optional = true }
cq-index = { workspace = true, optional = true }
cq-physical = { workspace = true, optional = true }
cq-access = { workspace = true, optional = true }
cq-providers = { workspace = true, optional = true }
cq-pull = { workspace = true, optional = true }
cq-pipeline = { workspace = true, optional = true }

[dev-dependencies]
cq-storage.workspace = true
cq-plan = { workspace = true, features = ["prefix", "graph"] }

[[example]]
name = "blocked-ya"
path = "../../examples/blocked-ya/main.rs"
required-features = ["physical", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-witnesses", "hash-rows", "sorted-rows", "block-rows", "pull", "stream-pipeline"]
test = true
harness = false

[[example]]
name = "rust-expressions"
path = "../../examples/rust-expressions/main.rs"
required-features = ["compiled-workloads"]
test = true
harness = false

[[example]]
name = "rust-expressions-planned"
path = "../../examples/rust-expressions/planned.rs"
required-features = ["compiled-workloads"]
test = true
harness = false

[[example]]
name = "negation-aggregation"
path = "../../examples/negation-aggregation/main.rs"
required-features = ["hw4", "defaults"]

# Multi-stage tests state their full macro composition. Native boundary tests
# instead gate individual cases so selected implementations remain executable.

[[test]]
name = "access_refinement"
required-features = ["physical", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-witnesses", "nested-witnesses", "hash-rows", "block-rows", "pull", "collect-pipeline", "stream-pipeline"]

[[test]]
name = "block_access"
required-features = ["defaults", "physical", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-witnesses", "block-rows", "stream-pipeline"]

[[test]]
name = "collect_endpoints"
required-features = ["pull", "collect-pipeline"]

[[test]]
name = "composition"
required-features = ["defaults"]

[[test]]
name = "empty_bindings"
required-features = ["defaults"]

[[test]]
name = "endpoint"
required-features = ["pull", "iterator-pipeline"]

[[test]]
name = "formal_counterexamples"
required-features = ["defaults"]

[[test]]
name = "heterogeneous"
required-features = ["physical", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-witnesses", "nested-witnesses", "hash-rows", "sorted-rows", "block-rows", "pull", "stream-pipeline"]

[[test]]
name = "hw4_optional"
required-features = ["hw4", "defaults"]

[[test]]
name = "planned_queries"
required-features = ["defaults"]

[[test]]
name = "provider_provenance"
required-features = ["block-rows", "hash-rows"]

[[test]]
name = "reference_hygiene"
required-features = ["compiled-workloads"]

[[test]]
name = "reusable_query"
required-features = ["defaults"]

[[test]]
name = "rust_expressions"
required-features = ["defaults"]

[[test]]
name = "stage_boundaries"
required-features = ["defaults"]

[[test]]
name = "storage_traits"
required-features = ["physical", "scan-rows", "prune-rows", "exact-keys", "zone-keys", "hash-witnesses", "hash-rows", "sorted-rows", "block-rows", "pull", "stream-pipeline"]

[[test]]
name = "typed_relations"
required-features = ["compiled-workloads"]
