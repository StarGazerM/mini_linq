[package]
name = "cq-compose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cq-ir.workspace = true
cq-query-lowering = { workspace = true, features = ["written-order", "clause-prefix", "hypergraph"] }
cq-index-policy = { workspace = true, features = ["base-demands", "result-demands"] }
cq-relation-lowering = { workspace = true, features = ["base-hash", "prefix-hash", "materialized-hash"] }
syn.workspace = true

[features]
hw4 = []

[dev-dependencies]
proc-macro2.workspace = true
quote.workspace = true
contracts.workspace = true
prettyplease.workspace = true
cq-access-lowering = { workspace = true, features = ["to-pipeline"] }
cq-pipeline-lowering = { workspace = true, features = ["distinct-iter", "collect-set", "support-iter"] }
cq-relation-lowering = { workspace = true, features = ["base-hash", "prefix-hash", "materialized-hash", "configured"] }
cq-native-lowering = { workspace = true, features = ["candidate-scan", "candidate-prune", "keys-exact", "keys-zone", "witness-hash", "witness-nested", "rows-hash", "rows-sorted", "rows-block"] }
syn = { workspace = true, features = ["visit", "visit-mut"] }
