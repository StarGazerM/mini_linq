[package]
name = "cq-compose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cq-ir.workspace = true
cq-plan = { workspace = true, features = ["canonical", "prefix", "graph"] }
cq-index = { workspace = true, features = ["input", "result"] }
cq-realize = { workspace = true, features = ["hash-inputs", "hash-prefix", "hash-materialized"] }
syn.workspace = true

[features]
hw4 = []

[dev-dependencies]
proc-macro2.workspace = true
quote.workspace = true
contracts.workspace = true
prettyplease.workspace = true
cq-execution = { workspace = true, features = ["pull"] }
cq-pipeline = { workspace = true, features = ["iterator", "collect", "stream"] }
cq-realize = { workspace = true, features = ["hash-inputs", "hash-prefix", "hash-materialized", "relations"] }
cq-native = { workspace = true, features = ["candidate-scan", "candidate-prune", "keys-exact", "keys-zone", "witness-hash", "witness-nested", "rows-hash", "rows-sorted", "rows-block"] }
syn = { workspace = true, features = ["visit", "visit-mut"] }
