[package]
name = "cq-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ahash = "=0.8.12"
hashbrown = { version = "=0.15.5", default-features = false, features = ["inline-more"] }

[dev-dependencies]
cq-load = { path = "../cq-load", default-features = false }

[features]
default = []
counters = []
# Independent timing mode; enabling counters as well retains every counter.
operator-timing = []

[[test]]
name = "counters"
required-features = ["counters"]
