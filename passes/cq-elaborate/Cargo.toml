[package]
name = "cq-elaborate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["reference"]
reference = ["cq-lang-ra/reference-prefix", "cq-lang-vo/reference-prefix"]

[dependencies]
cq-lang-ra = { workspace = true, default-features = false }
cq-lang-vo = { workspace = true, default-features = false }
quote.workspace = true
syn.workspace = true

[dev-dependencies]
cq-syntax.workspace = true
cq-lang-cq = { workspace = true, default-features = false }

proc-macro2.workspace = true

[package.metadata.cq]
source = "cq-lang-vo"
target = "cq-lang-ra"

[[test]]
name = "elaborate"
required-features = ["reference"]
