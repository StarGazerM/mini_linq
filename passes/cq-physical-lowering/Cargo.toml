[package]
name = "cq-physical-lowering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["reference"]
reference = ["cq-lang-ix/reference-prefix", "cq-lang-physical/reference-prefix"]

[dependencies]
cq-lang-ix = { workspace = true, default-features = false }
cq-lang-physical = { workspace = true, default-features = false }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
cq-lang-vo = { workspace = true, default-features = false, features = ["reference-prefix"] }
cq-syntax.workspace = true
cq-lang-cq = { workspace = true, default-features = false }
cq-lang-ra = { workspace = true, default-features = false, features = ["reference-prefix"] }

cq-index-policy = { workspace = true, features = ["reference"] }
cq-order = { workspace = true, features = ["reference"] }
cq-reduce = { workspace = true, features = ["reference"] }
cq-elaborate = { workspace = true, features = ["reference"] }

[package.metadata.cq]
source = "cq-lang-ix"
target = "cq-lang-physical"

[[test]]
name = "lowering"
required-features = ["reference"]
